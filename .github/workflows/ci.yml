name: ci

# Quality gate for every push and pull request: dependency audit, type check
# and a production build against the local (PGlite) database.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          LOCAL_DEV: "1"
          NEXT_TELEMETRY_DISABLED: "1"
